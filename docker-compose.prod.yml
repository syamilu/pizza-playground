# VPS overrides: run the images CI pushed to GHCR, listen on 127.0.0.1 only (the host Caddy
# is the public entry), and come back up after a reboot.
# Used as: docker compose -f docker-compose.yml -f docker-compose.prod.yml
services:
  db:
    ports: !reset []
    restart: unless-stopped
  api:
    image: ghcr.io/syamilu/pizza-playground/api:${IMAGE_TAG:-latest}
    ports: !override ["127.0.0.1:8080:8080"]
    restart: unless-stopped
  mock-gateway:
    image: ghcr.io/syamilu/pizza-playground/mock-gateway:${IMAGE_TAG:-latest}
    ports: !override ["127.0.0.1:8090:8090"]
    restart: unless-stopped
  web:
    image: ghcr.io/syamilu/pizza-playground/web:${IMAGE_TAG:-latest}
    ports: !override ["127.0.0.1:3000:3000"]
    restart: unless-stopped

  # Metrics agents for the laptop monitoring stack (monitoring/). They listen on 127.0.0.1
  # only; monitoring/tunnel.sh forwards them over SSH. mem_limit keeps a misbehaving agent from
# starving the app on the 2 GB VPS.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    command: ["--path.rootfs=/host"]
    pid: host
    volumes: ["/:/host:ro,rslave"]
    ports: ["127.0.0.1:9100:9100"]
    mem_limit: 64m
    restart: unless-stopped
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    # only cpu, memory and network are left on; the dashboard uses nothing else
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
      - --disable_metrics=advtcp,cpu_topology,cpuset,disk,diskIO,hugetlb,memory_numa,percpu,perf_event,process,referenced_memory,resctrl,sched,tcp,udp
    privileged: true
    devices: ["/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports: ["127.0.0.1:8081:8080"]
    mem_limit: 128m
    restart: unless-stopped
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB:-playground}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-playground}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:-playground}
    ports: ["127.0.0.1:9187:9187"]
    mem_limit: 64m
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
