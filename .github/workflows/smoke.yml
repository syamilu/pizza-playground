name: smoke

on: [push, pull_request]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - run: bash scripts/smoke.sh
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
